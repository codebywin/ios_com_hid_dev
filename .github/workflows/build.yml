name: Build HideDeveloperMode (com.hid.dev)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install ldid dpkg

      - name: Setup RootHide Theos & iOS SDKs
        run: |
          git clone --recursive https://github.com/roothide/theos.git $HOME/theos
          curl -fsSL https://github.com/theos/sdks/archive/master.zip -o sdks.zip
          unzip -q sdks.zip
          mv sdks-master/*.sdk $HOME/theos/sdks/
          rm -rf sdks.zip sdks-master
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build RootHide deb
        run: |
          mkdir -p output
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          for f in packages/*.deb; do
            [ -e "$f" ] || continue
            cp "$f" "output/roothide_$(basename "$f")"
          done

      - name: Build Rootless deb
        run: |
          rm -rf packages
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          for f in packages/*.deb; do
            [ -e "$f" ] || continue
            cp "$f" "output/rootless_$(basename "$f")"
          done

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hidedev-packages
          path: output/*.deb
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: output/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
