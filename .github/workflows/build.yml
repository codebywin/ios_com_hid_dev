name: Build iOS Tweak (.deb)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    strategy:
      matrix:
        scheme: [rootless, roothide]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set Environment Variables
        run: |
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/roothide/theos.git $THEOS

      - name: Setup iOS SDK
        run: |
          mkdir -p $THEOS/sdks
          curl -LO https://github.com/theos/sdks/releases/download/v16.5/iPhoneOS16.5.sdk.tar.xz || curl -LO https://github.com/xybp888/iOS-SDKs/releases/download/16.5/iPhoneOS16.5.sdk.tar.xz
          tar -xf iPhoneOS16.5.sdk.tar.xz -C $THEOS/sdks/
          rm -f iPhoneOS16.5.sdk.tar.xz

      - name: Build Package (${{ matrix.scheme }})
        run: |
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=${{ matrix.scheme }}

      - name: Rename Output DEB
        run: |
          mkdir -p output
          for file in packages/*.deb; do
            filename=$(basename "$file")
            cp "$file" "output/${{ matrix.scheme }}_$filename"
          done

      - name: Upload Artifact (${{ matrix.scheme }})
        uses: actions/upload-artifact@v4
        with:
          name: com_hid_dev_${{ matrix.scheme }}
          path: output/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-debs
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: all-debs/*.deb
          generate_release_notes: true
